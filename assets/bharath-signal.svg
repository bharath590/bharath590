<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">Bharath Goud — systems in motion</title><desc id="desc">A signal travels through five career nodes from Simplilearn to Microsoft while stars drift around the name Bharath Goud.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1024"/><stop offset="1" stop-color="#17112d"/></linearGradient><linearGradient id="line"><stop stop-color="#82eddf"/><stop offset=".5" stop-color="#ae88ff"/><stop offset="1" stop-color="#fd7fae"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8593bf" stroke-opacity=".12"/></pattern></defs>
<style>
@keyframes dash{to{stroke-dashoffset:-36}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes blink{50%{opacity:.28}}@keyframes travel{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}@keyframes reveal{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.track{stroke-dasharray:6 12;animation:dash 1.6s linear infinite}.spark{offset-path:path('M80 256 C230 246 320 279 460 249 S755 251 920 226');animation:travel 5.5s linear infinite}.star{animation:blink 2.4s ease-in-out infinite}.name{animation:reveal 1s ease-out both}.sub{animation:reveal 1s .3s ease-out both}.node{animation:float 5s ease-in-out infinite}.n2{animation-delay:-1s}.n3{animation-delay:-2s}.n4{animation-delay:-3s}.n5{animation-delay:-4s}@media(prefers-reduced-motion:reduce){*{animation:none!important}.spark{display:none}}
</style>
<rect width="1000" height="330" rx="24" fill="url(#bg)"/><rect width="1000" height="330" rx="24" fill="url(#grid)"/>
<circle cx="830" cy="74" r="135" fill="#8456ff" opacity=".08"/><circle cx="170" cy="200" r="160" fill="#52e3cf" opacity=".06"/>
<g fill="#c3cdff"><circle class="star" cx="92" cy="71" r="2"/><circle class="star" cx="830" cy="45" r="2" style="animation-delay:.7s"/><circle class="star" cx="922" cy="139" r="1.5" style="animation-delay:1.2s"/><circle class="star" cx="590" cy="42" r="1.5" style="animation-delay:1.8s"/></g>
<text x="70" y="65" fill="#d4ff75" font-family="monospace" font-size="13" letter-spacing="3">&gt; BHARATH.SYSTEMS / ONLINE</text>
<g class="name"><text x="67" y="147" fill="#f7f8ff" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="69" letter-spacing="-4">BHARATH GOUD</text><circle cx="685" cy="122" r="8" fill="#d4ff75"/></g>
<text class="sub" x="72" y="183" fill="#b9c3df" font-family="Arial,Helvetica,sans-serif" font-size="17">identity • distributed systems • cloud infrastructure</text>
<path d="M80 256 C230 246 320 279 460 249 S755 251 920 226" fill="none" stroke="url(#line)" opacity=".32" stroke-width="12" filter="url(#glow)"/><path class="track" d="M80 256 C230 246 320 279 460 249 S755 251 920 226" fill="none" stroke="url(#line)" stroke-width="2"/><circle class="spark" r="6" fill="#d4ff75"/>
<g font-family="monospace" font-size="11" text-anchor="middle"><g class="node"><circle cx="91" cy="256" r="6" fill="#82eddf"/><text x="91" y="286" fill="#b9c3df">Simplilearn</text></g><g class="node n2"><circle cx="286" cy="259" r="6" fill="#82eddf"/><text x="286" y="289" fill="#b9c3df">MFine</text></g><g class="node n3"><circle cx="472" cy="248" r="6" fill="#ac9bff"/><text x="472" y="279" fill="#b9c3df">Apollo 24/7</text></g><g class="node n4"><circle cx="684" cy="250" r="6" fill="#ac9bff"/><text x="684" y="281" fill="#b9c3df">Deutsche Bank</text></g><g class="node n5"><circle cx="914" cy="227" r="8" fill="#d4ff75"/><text x="914" y="261" fill="#d4ff75">Microsoft</text></g></g>
</svg>
